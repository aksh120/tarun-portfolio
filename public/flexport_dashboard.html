    <script>
        tailwind.config = {
            darkMode: 'class'

    <style>
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .tooltip-enter {
            animation: fadeIn 0.2s ease-out;
        }

        .hover-card:hover {
            transform: translateY(-2px);
        }

        .hover-card {
            transition: all 0.3s ease;
        }

        /* Smooth scrolling */
        html {
            scroll-behavior: smooth;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }

        ::-webkit-scrollbar-thumb {
            background: #94a3b8;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }

        /* Dark mode scrollbar */
        .dark ::-webkit-scrollbar-track {
            background: #1e293b;
        }

        .dark ::-webkit-scrollbar-thumb {
            background: #475569;
        }

        .dark ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }
    </style>
</head>

        // State

        // Bar Chart Component
        function createBarChart(data, colorScheme, title, containerId) {
            const maxValue = Math.max(...data.map(d => d.value));
            const colors = {
                red: { bar: '#EF4444', hover: '#DC2626', bg: '#FEE2E2' },
                green: { bar: '#10B981', hover: '#059669', bg: '#D1FAE5' },
                blue: { bar: '#0EA5E9', hover: '#0284C7', bg: '#E0F2FE' }
            };

            const html = data.map((item, idx) => {
                const percentage = (item.value / maxValue) * 100;
                const mapColor = { red: 'rose', green: 'emerald', blue: 'sky' };
                const twColor = mapColor[colorScheme];

                return `
                    <div class="relative mb-3">
                        <div class="flex items-center gap-4">
                            <div class="w-36 text-sm text-slate-700 dark:text-slate-300 font-medium">${item.name}</div>
                            <div class="flex-1 relative bar-container group" data-chart="${title}" data-index="${idx}">
                                <div class="h-12 rounded-xl overflow-hidden bg-${twColor}-100 dark:bg-${twColor}-900/30 transition-colors">
                                    <div class="bar h-full rounded-xl flex items-center justify-end pr-4 text-white font-semibold transition-all duration-500 shadow-sm bg-${twColor}-500 group-hover:bg-${twColor}-600" 
                                         style="width: ${percentage}%;">
                                        ${percentage > 20 ? item.value : ''}
                                    </div>
                                </div>
                                <div class="tooltip-box hidden absolute left-0 -top-20 bg-slate-800 dark:bg-slate-700 text-white px-4 py-3 rounded-xl shadow-2xl z-20 tooltip-enter border border-slate-700 dark:border-slate-600">
                                    <div class="font-bold text-base mb-1">${item.tooltip || item.name}</div>
                                    <div class="text-sm text-slate-300">Value: ${item.value}</div>
                                    <div class="absolute bottom-0 left-8 transform translate-y-1/2 rotate-45 w-3 h-3 bg-slate-800 dark:bg-slate-700 border-r border-b border-slate-700 dark:border-slate-600"></div>
                                </div>
                            </div>
                            ${percentage <= 20 ? `<div class="w-12 text-sm font-semibold text-slate-700 dark:text-slate-300">${item.value}</div>` : ''}
                        </div>
                    </div>
                `;
            }).join('');

            document.getElementById(containerId).innerHTML = html;

            // Add hover listeners
            document.querySelectorAll(`.bar-container[data-chart="${title}"]`).forEach(container => {
                const tooltip = container.querySelector('.tooltip-box');

                container.addEventListener('mouseenter', () => {
                    tooltip.classList.remove('hidden');
                });

                container.addEventListener('mouseleave', () => {
                    tooltip.classList.add('hidden');
                });
            });
        }


        // Line Chart Component
        function createLineChart(data, dataKey, colorScheme, label, containerId) {
            const maxValue = Math.max(...data.map(d => d[dataKey]));
            const minValue = Math.min(...data.map(d => d[dataKey]));
            const range = maxValue - minValue;

            const colors = {
                blue: { stroke: '#0EA5E9', fill: '#0EA5E9' },
                purple: { stroke: '#A855F7', fill: '#A855F7' },
                green: { stroke: '#10B981', fill: '#10B981' }
            };

            // Create SVG path
            const points = data.map((d, i) => {
                const x = (i / (data.length - 1)) * 100;
                const y = 40 - ((d[dataKey] - minValue) / range) * 32;
                return { x, y, value: d[dataKey], label: d.year || d.month };
            });

            const linePath = points.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x},${p.y}`).join(' ');
            const areaPath = `M 0,40 ${points.map(p => `L ${p.x},${p.y}`).join(' ')} L 100,40 Z`;

            const html = `
                <div class="relative h-64 bg-gradient-to-b from-slate-50 to-white dark:from-slate-800 dark:to-slate-900 rounded-2xl p-6 border border-slate-200 dark:border-slate-700 shadow-sm transition-colors duration-300">
                    <div class="text-sm font-semibold text-slate-600 dark:text-slate-300 mb-4">${label}</div>
                    <svg class="w-full h-full" viewBox="0 0 100 40" preserveAspectRatio="none">
                        <defs>
                            <linearGradient id="grad-${colorScheme}" x1="0%" y1="0%" x2="0%" y2="100%">
                                <stop offset="0%" style="stop-color: ${colors[colorScheme].stroke}; stop-opacity: 0.3" />
                                <stop offset="100%" style="stop-color: ${colors[colorScheme].stroke}; stop-opacity: 0" />
                            </linearGradient>
                        </defs>
                        <path d="${areaPath}" fill="url(#grad-${colorScheme})" />
                        <path d="${linePath}" fill="none" stroke="${colors[colorScheme].stroke}" stroke-width="0.6" />
                        ${points.map((p, i) => `
                            <circle class="line-point cursor-pointer transition-all" 
                                    cx="${p.x}" cy="${p.y}" r="1.2" 
                                    fill="${colors[colorScheme].fill}"
                                    data-index="${i}" data-value="${p.value}" data-label="${p.label}" />
                        `).join('')}
                    </svg>
                    <div id="line-tooltip-${containerId}" class="hidden absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-slate-800 dark:bg-slate-700 text-white px-5 py-3 rounded-xl shadow-2xl z-20 tooltip-enter border border-slate-700 dark:border-slate-600">
                        <div class="text-xs text-slate-300 mb-1">Year</div>
                        <div class="text-2xl font-bold">Value</div>
                    </div>
                    <div class="flex justify-between mt-3 text-xs text-slate-500 dark:text-slate-400">
                        <span>${data[0].year || data[0].month}</span>
                        <span>${data[Math.floor(data.length / 2)].year || data[Math.floor(data.length / 2)].month}</span>
                        <span>${data[data.length - 1].year || data[data.length - 1].month}</span>
                    </div>
                </div>
            `;

            document.getElementById(containerId).innerHTML = html;

            // Add hover to points
            document.querySelectorAll(`#${containerId} .line-point`).forEach(point => {
                const tooltip = document.getElementById(`line-tooltip-${containerId}`);

                point.addEventListener('mouseenter', (e) => {
                    const value = e.target.dataset.value;
                    const label = e.target.dataset.label;
                    tooltip.innerHTML = `
                        <div class="text-xs text-slate-300 mb-1">${label}</div>
                        <div class="text-2xl font-bold">${value}%</div>
                    `;
                    tooltip.classList.remove('hidden');
                    point.setAttribute('r', '1.8');
                });

                point.addEventListener('mouseleave', () => {
                    tooltip.classList.add('hidden');
                    point.setAttribute('r', '1.2');
                });
            });
        }

                };
                const colors = {

                        ? `bg-${colors[view]}-50 dark:bg-${colors[view]}-900/20 text-${colors[view]}-700 dark:text-${colors[view]}-300 font-bold border-b-2 border-${colors[view]}-500`
